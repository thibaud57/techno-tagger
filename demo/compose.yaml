# Demo web publique : conteneur nginx non-root, durci, sans port publie.
# L'image vient de DEMO_IMAGE (definie dans l'environnement du deploiement).
services:
  demo:
    image: ${DEMO_IMAGE}
    # Un tag mutable (latest) doit etre retire a chaque deploiement.
    pull_policy: always
    restart: unless-stopped
    init: true
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
