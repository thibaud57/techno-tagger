worker_processes 1;
error_log /dev/stderr warn;
# Systeme de fichiers en lecture seule : tout ce que nginx ecrit va sous /tmp.
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    # La demo ne recoit aucun corps.
    client_max_body_size 1k;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    # text/html est compresse d'office. Le scenario porte toutes les reponses enregistrees.
    gzip_types application/json application/javascript text/css image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            include /etc/nginx/headers.conf;
            return 200 "ok\n";
        }

        location = /index.html {
            include /etc/nginx/headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location = /demo/scenario.json {
            include /etc/nginx/headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Un asset disparu apres un redeploiement rend 404, jamais index.html sous un mauvais type.
        # Ni hache ni versionne : revalide a chaque visite, une traduction perimee cotoierait un
        # bundle neuf apres un redeploiement de `latest`.
        location ^~ /demo/ {
            include /etc/nginx/headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location ^~ /i18n/ {
            include /etc/nginx/headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Hash de contenu d'Angular, 8 caracteres avant l'extension : base32 en majuscules pour
        # main, styles et les polices, base64url en casse mixte pour les chunks.
        location ~ "-[A-Za-z0-9_-]{8}\.\w+$" {
            include /etc/nginx/headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~ \.\w+$ {
            include /etc/nginx/headers.conf;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/headers.conf;
            try_files $uri /index.html;
        }
    }
}
