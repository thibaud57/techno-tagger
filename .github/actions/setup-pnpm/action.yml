name: Installer pnpm et Node
description: Seul endroit des workflows ou vit la version de Node
runs:
  using: composite
  steps:
    # Version de pnpm lue dans devEngines de package.json. Ni setup-node ni corepack.
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: node@24
        cache: true
