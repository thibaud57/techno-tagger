name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un build de release interrompu en pleine signature laisserait une Release
# incomplete : ici on n'annule jamais, contrairement au gate qualite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: PR de release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  sync-lockfiles:
    name: Realigner les lockfiles dans la PR de release
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: ./.github/actions/setup-uv
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # extra-files ne sait pas toucher aux lockfiles : ils portent la version du
      # package local dans un tableau, que l'updater TOML ignore sans echouer.
      # `uv sync --locked` refuse un uv.lock desaccorde : sans ce job, le lock
      # committe au tag ne porterait pas la version publiee.
      - name: Rejouer le lock du sidecar
        working-directory: sidecar
        run: uv lock
      # Et non `cargo check` : reecrit le lock sans compiler, donc sans declencher
      # la validation externalBin qui exigerait le binaire du sidecar.
      - name: Rejouer le lock de la coquille
        working-directory: src-tauri
        run: cargo update --workspace
      - name: Committer les lockfiles realignes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidecar/uv.lock src-tauri/Cargo.lock
          git diff --staged --quiet || git commit -m "chore: realigner les lockfiles sur la version de release"
          git push

  sentry-release:
    name: Releases Sentry
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Deux projets Sentry, un par SDK : la release doit exister des deux cotes,
      # donc l'echec de l'un n'annule pas l'autre.
      fail-fast: false
      matrix:
        project: [techno-tagger-ui, techno-tagger-sidecar]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # set_commits: auto remonte l'historique depuis la release precedente.
          fetch-depth: 0

      - uses: getsentry/action-release@6fb9aeade7061441cf3864e34fbe11a1457ad7dc # v3.7.1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: tg-ws
          SENTRY_PROJECT: ${{ matrix.project }}
        with:
          # release-please rend la version nue, les deux SDK posent `techno-tagger@X.Y.Z`.
          release: techno-tagger@${{ needs.release-please.outputs.version }}
          environment: production
          set_commits: auto

  build:
    name: Build et publication
    needs: release-please
    # Defaut a 6 heures : un build bloque les consommerait entierement
    timeout-minutes: 45
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Et non le defaut github.sha : il vaut la tete de main sur un
          # workflow_dispatch, pas le commit que release-please vient de taguer.
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup-uv
      - uses: ./.github/actions/setup-pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: ./.github/actions/setup-just

      - run: pnpm install --frozen-lockfile
      - name: Installer les dependances du sidecar
        run: uv sync --locked --all-groups
        working-directory: sidecar

      # tauri-action n'offre aucun hook pour construire un sidecar : le binaire
      # doit etre en place avant son invocation.
      - run: just build-sidecar
        env:
          # Grave par build.py dans le binaire fige : PyInstaller n'a pas
          # d'equivalent au --define d'esbuild. Absent, le SDK reste inerte.
          SENTRY_DSN_SIDECAR: ${{ secrets.SENTRY_DSN_SIDECAR }}

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Absents, le build echoue ("public key found, but no private key") au
          # lieu de publier une Release sans latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lus par `pnpm build` (declenche par tauri-action via beforeBuildCommand)
          # puis substitues dans le bundle par --define. Sans eux : notice de licence
          # affichee, SDK Sentry inerte dans la version distribuee.
          PRIMENG_LICENSE_KEY: ${{ secrets.PRIMENG_LICENSE_KEY }}
          SENTRY_DSN_UI: ${{ secrets.SENTRY_DSN_UI }}
          # Lu par le script `sourcemaps` : sans lui, la trace d'un crash Angular
          # arrive minifiee. Org et projet ont leur defaut, non secrets.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: false

      # tauri-action v1 ecrit l'URL d'API de l'asset (tauri-action#1315), limitee a 60 appels
      # par heure et par IP sans token. Le lien sous le tag n'a pas ce quota.
      - name: Publier latest.json avec les liens de telechargement
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          gh release download $env:TAG --pattern latest.json --dir $env:RUNNER_TEMP --clobber
          $path = Join-Path $env:RUNNER_TEMP 'latest.json'
          $links = @{}
          foreach ($asset in (gh release view $env:TAG --json assets | ConvertFrom-Json).assets) { $links[$asset.apiUrl] = $asset.url }
          $apiUrl = 'https://api\.github\.com/repos/[^/"]+/[^/"]+/releases/assets/\d+'
          # Texte remplace tel quel : ConvertTo-Json reformaterait pub_date.
          $raw = Get-Content $path -Raw
          foreach ($match in [regex]::Matches($raw, $apiUrl)) {
            if (-not $links.ContainsKey($match.Value)) { throw "Asset inconnu de la Release $env:TAG : $($match.Value)" }
          }
          [IO.File]::WriteAllText($path, [regex]::Replace($raw, $apiUrl, { param($m) $links[$m.Value] }))
          gh release upload $env:TAG $path --clobber

      # tauri-action reste vert sans artefact d'updater (constate sur la v0.1.0), et
      # Tauri valide tout latest.json avant d'en lire la version : sans ce controle,
      # une Release que l'updater ne verrait pas passerait inapercue.
      - name: Verifier les artefacts de l'updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = @(gh release view $env:TAG --json assets --jq '.assets[].name')
          if ($assets -notcontains 'latest.json') { throw "latest.json absent de la Release $env:TAG" }
          gh release download $env:TAG --pattern latest.json --dir $env:RUNNER_TEMP --clobber
          $manifest = Get-Content (Join-Path $env:RUNNER_TEMP 'latest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) { throw "latest.json annonce $($manifest.version), attendu $env:VERSION" }
          # L'updater cherche windows-x86_64-nsis avant windows-x86_64 : toute entree
          # windows presente doit etre saine, pas seulement la generique.
          $entries = @($manifest.platforms.PSObject.Properties | Where-Object { $_.Name -like 'windows-x86_64*' })
          if ($entries.Name -notcontains 'windows-x86_64') { throw "Entree windows-x86_64 absente de latest.json" }
          $expected = "/releases/download/$([regex]::Escape($env:TAG))/[^/]+-setup\.exe$"
          foreach ($entry in $entries) {
            if (-not $entry.Value.signature) { throw "Signature $($entry.Name) vide dans latest.json" }
            if ($entry.Value.url -notmatch $expected) { throw "url $($entry.Name) hors du tag $env:TAG : $($entry.Value.url)" }
            # Le manifeste peut annoncer un installeur dont le .sig n'a pas ete publie.
            $setup = ($entry.Value.url -split '/')[-1]
            if ($assets -notcontains "$setup.sig") { throw "$setup.sig absent de la Release $env:TAG (entree $($entry.Name))" }
          }
          Write-Output "latest.json $($manifest.version) et sa signature publies sur $env:TAG"
