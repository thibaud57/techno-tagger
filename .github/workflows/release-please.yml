name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un build de release interrompu en pleine signature laisserait une Release
# incomplete : ici on n'annule jamais, contrairement au gate qualite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: PR de release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-lockfiles:
    name: Realigner les lockfiles dans la PR de release
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # extra-files ne sait pas toucher aux lockfiles : ils portent la version du
      # package local dans un tableau, que l'updater TOML ignore sans echouer. Un
      # uv.lock desaccorde casse `uv sync --frozen` au build, donc apres le tag.
      - name: Rejouer le lock du sidecar
        working-directory: sidecar
        run: uv lock
      # Et non `cargo check` : reecrit le lock sans compiler, donc sans declencher
      # la validation externalBin qui exigerait le binaire du sidecar.
      - name: Rejouer le lock de la coquille
        working-directory: src-tauri
        run: cargo update --workspace
      - name: Committer les lockfiles realignes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidecar/uv.lock src-tauri/Cargo.lock
          git diff --staged --quiet || git commit -m "chore: realigner les lockfiles sur la version de release"
          git push

  sentry-release:
    name: Releases Sentry
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Deux projets Sentry, un par SDK : la release doit exister des deux cotes.
      matrix:
        project: [techno-tagger-ui, techno-tagger-sidecar]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # set_commits: auto remonte l'historique depuis la release precedente.
          fetch-depth: 0

      - uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: tg-ws
          SENTRY_PROJECT: ${{ matrix.project }}
        with:
          # release-please rend la version nue, les deux SDK posent `techno-tagger@X.Y.Z`.
          release: techno-tagger@${{ needs.release-please.outputs.version }}
          environment: production
          set_commits: auto

  build:
    name: Build et publication
    needs: release-please
    # Defaut a 6 heures : un build bloque les consommerait entierement
    timeout-minutes: 45
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Et non le defaut github.sha : il vaut la tete de main sur un
          # workflow_dispatch, pas le commit que release-please vient de taguer.
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
          enable-cache: true
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: '11.24.0'
          runtime: node@24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - run: pnpm install --frozen-lockfile
      - name: Installer les dependances du sidecar
        run: uv sync --frozen --all-groups
        working-directory: sidecar

      # tauri-action n'offre aucun hook pour construire un sidecar : le binaire
      # doit etre en place avant son invocation.
      - run: just build-sidecar
        env:
          # Grave par build.py dans le binaire figé : PyInstaller n'a pas
          # d'equivalent au --define d'esbuild. Absent, le SDK reste inerte.
          SENTRY_DSN_SIDECAR: ${{ secrets.SENTRY_DSN_SIDECAR }}

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # TODO: paire de cles updater a l'etape 9. Sans elle, pas de latest.json
          # dans la Release, donc aucun client ne voit la mise a jour.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lus par `pnpm build`, que tauri-action declenche via beforeBuildCommand,
          # et substitues dans le bundle par --define. Sans eux : notice de licence
          # affichee, et SDK Sentry inerte dans la version distribuee.
          PRIMENG_LICENSE_KEY: ${{ secrets.PRIMENG_LICENSE_KEY }}
          SENTRY_DSN_UI: ${{ secrets.SENTRY_DSN_UI }}
          # Lu par le script `sourcemaps` : sans lui, la trace d'un crash Angular
          # arrive minifiee. Org et projet ont leur defaut, non secrets.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: false
