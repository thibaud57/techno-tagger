name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

# Un push qui en chasse un autre annule le run precedent, mais seulement sur PR :
# sur main chaque commit garde son propre resultat de CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Markdown seul : les quatre zones sont sautees et `ci` passe quand meme. Un filtre
  # `paths-ignore` natif laisserait `ci`, exige par la protection, sans resultat.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      # Lecture des fichiers de la PR par paths-filter
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            source:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  sidecar:
    # Exception documentee au defaut ubuntu-24.04 : le sidecar cible Windows par
    # ce qu'il touche, backend keyring WinVault, encodage cp1252 des flux standard
    # et %LOCALAPPDATA%. Sur Linux ces regressions passeraient le gate sans bruit.
    name: Sidecar (ruff, mypy, pytest)
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      - uses: ./.github/actions/setup-just
      - name: Installer les dependances
        run: uv sync --locked --all-groups
        working-directory: sidecar
      - run: just lint-sidecar
        env:
          # Annotations natives sur la PR, sans divergence entre la recette locale et la CI
          RUFF_OUTPUT_FORMAT: github
      - run: just typecheck-sidecar
      - run: just test-sidecar
      # Non bloquant : une CVE publiee en amont ne doit pas figer une PR sans rapport ;
      # la Checklist Release oblige a lire le resultat (PRODUCTION § Dependances).
      - name: Audit dependencies sidecar
        id: audit-sidecar
        run: just audit-sidecar
        continue-on-error: true
      # `continue-on-error` conclut le step en succès : sans ce warning, un audit rouge passe inaperçu.
      - name: Signaler l'échec de l'audit sidecar
        if: steps.audit-sidecar.outcome == 'failure'
        run: echo "::warning title=Audit des dépendances sidecar::just audit-sidecar a relevé des vulnérabilités"

  ui:
    name: Webview (eslint, tsc, build, vitest)
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-just
      # Script epingle au commit du tag v1.7.12 et binaire epingle par l'argument :
      # une URL sur `main` serait une reference mutable, comme un tag d'action
      - name: Installer actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: just lint-ui
      - run: just lint-workflows
      - run: just typecheck-ui
      # tsc --noEmit ne verifie pas les templates : seul le compilateur Angular
      # le fait, or ni typecheck-ui ni test-ui ne le declenchent sur toute l'app.
      - run: just build-ui
      - name: Garde du bundle desktop
        run: test -d dist/techno-tagger-ui/browser && test ! -d dist/techno-tagger-ui/browser/demo && ! grep -rl "scenario.json\|app-demo-banner" dist/techno-tagger-ui/browser
      - run: just build-demo
      - run: just test-ui
      # Non bloquant, meme raison que pour le sidecar
      - name: Audit dependencies UI
        id: audit-ui
        run: just audit-ui
        continue-on-error: true
      - name: Signaler l'échec de l'audit UI
        if: steps.audit-ui.outcome == 'failure'
        run: echo "::warning title=Audit des dépendances UI::just audit-ui a relevé des vulnérabilités"

  tauri:
    # Exception documentee au defaut ubuntu-24.04 : la coquille ne cible que
    # Windows (cible MSVC, externalBin du sidecar en .exe). Clippy sous Linux
    # ne compilerait pas le code reellement livre.
    name: Coquille Tauri (check, clippy)
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      # Le rust-toolchain.toml du depot prime sur la selection de l'action
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: ./.github/actions/setup-just
      - name: Installer les dependances du sidecar
        run: uv sync --locked --all-groups
        working-directory: sidecar
      # externalBin est valide des la compilation : sans le binaire en place,
      # cargo check echoue avant meme de compiler notre code.
      - run: just build-sidecar
      - run: just smoke-sidecar
      - run: just lint-tauri

  # L'image de la demo est construite et sondee a chaque PR, sans rien publier ni
  # secret : la cle PrimeNG reste vide, le build suffit a prouver le Dockerfile.
  demo-image:
    name: Image de demo (build, sonde)
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile
          load: true
          tags: techno-tagger-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Memes contraintes que le compose de production : lecture seule, sans capability.
      # La CSP attendue est lue dans demo/headers.conf, jamais recopiee ici.
      - name: Sonder l'image en lecture seule
        run: |
          check() { local message=$1; shift; "$@" || { echo "::error::$message"; exit 1; }; }

          docker run -d --name demo --read-only --tmpfs /tmp:size=16m --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 64 --memory 128m --cpus 0.5 \
            -p 8080:8080 techno-tagger-demo:ci
          base=http://127.0.0.1:8080
          csp=$(grep -oP 'Content-Security-Policy "\K[^"]+' demo/headers.conf) || { echo "::error::CSP introuvable dans demo/headers.conf"; exit 1; }
          check "$base/healthz ne repond pas apres 10 essais" \
            curl -fs --max-time 5 --retry 10 --retry-delay 1 --retry-all-errors -o /dev/null "$base/healthz"

          # grep -i : les noms d'en-tete sont insensibles a la casse
          for path in / /settings /demo/scenario.json /nope.js; do
            headers=$(curl -s --max-time 5 -D - -o /dev/null "$base$path" | tr -d '\r')
            check "$path : Content-Security-Policy absente ou differente de demo/headers.conf" grep -qixF "Content-Security-Policy: $csp" <<< "$headers"
            check "$path : X-Robots-Tag: noindex absent" grep -qix 'X-Robots-Tag: noindex' <<< "$headers"
            case $path in
              /nope.js) check "/nope.js : statut different de 404" grep -q '^HTTP/[0-9.]* 404' <<< "$headers" ;;
              /demo/scenario.json) check "/demo/scenario.json : Cache-Control no-cache absent" grep -qi '^Cache-Control:.*no-cache' <<< "$headers" ;;
            esac
          done

          settings_body=$(curl -s --max-time 5 "$base/settings")
          check "/settings : <app-root absent, le repli SPA ne sert pas index.html" grep -q '<app-root' <<< "$settings_body"
          uid=$(docker exec demo id -u)
          check "Le conteneur tourne en root (uid 0)" test "$uid" != 0
      - name: Journaux du conteneur
        if: failure()
        run: docker logs demo || true

  # Check unique exige par la protection de branche : les noms des quatre jobs
  # ci-dessus peuvent changer sans toucher aux reglages du depot ; un job
  # ajoute plus tard est couvert des qu'il entre dans `needs`.
  ci:
    needs: [changes, sidecar, ui, tauri, demo-image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Zone sautee (`skipped`) = PR de markdown seul, acceptee ; detection en echec, refusee
      - name: Verifier les quatre zones
        env:
          CHANGES: ${{ needs.changes.result }}
          SIDECAR: ${{ needs.sidecar.result }}
          UI: ${{ needs.ui.result }}
          TAURI: ${{ needs.tauri.result }}
          DEMO_IMAGE: ${{ needs.demo-image.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::La detection des fichiers modifies n'est pas passee"
            exit 1
          fi
          echo "sidecar=$SIDECAR ui=$UI tauri=$TAURI demo-image=$DEMO_IMAGE"
          for r in "$SIDECAR" "$UI" "$TAURI" "$DEMO_IMAGE"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Une zone au moins n'est pas passee"
              exit 1
            fi
          done
