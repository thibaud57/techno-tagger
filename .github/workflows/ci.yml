name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un push qui en chasse un autre annule le run precedent, mais seulement sur PR :
# sur main et develop chaque commit garde son propre resultat de CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sidecar:
    # Exception documentee au defaut ubuntu-latest : le sidecar cible Windows par
    # ce qu'il touche, backend keyring WinVault, encodage cp1252 des flux standard
    # et %LOCALAPPDATA%. Sur Linux ces regressions passeraient le gate sans bruit.
    name: Sidecar (ruff, mypy, pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Installer les dependances
        run: uv sync --frozen --all-groups
        working-directory: sidecar
      - run: just lint-sidecar
      - run: just typecheck-sidecar
      - run: just test-sidecar

  ui:
    name: Webview (eslint, tsc, build, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installe pnpm ET Node en une etape : ni actions/setup-node, ni corepack,
      # retire des binaires Node depuis la 25.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: '11.24.0'
          runtime: node@24
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: pnpm install --frozen-lockfile
      - run: just lint-ui
      - run: just typecheck-ui
      # tsc --noEmit ne verifie pas les templates : seul le compilateur Angular
      # le fait, et ni typecheck-ui ni test-ui ne le declenchent sur toute l'app.
      - run: just build-ui
      - run: just test-ui

  tauri:
    name: Coquille Tauri (check, clippy)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
          enable-cache: true
      # Le rust-toolchain.toml du depot prime sur la selection de l'action
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Installer les dependances du sidecar
        run: uv sync --frozen --all-groups
        working-directory: sidecar
      # externalBin est valide des la compilation : sans le binaire en place,
      # cargo check echoue avant meme de compiler notre code.
      - run: just build-sidecar
      - run: just lint-tauri
