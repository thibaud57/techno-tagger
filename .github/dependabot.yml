version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: "uv"
    directory: "/sidecar"
    target-branch: develop
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    target-branch: develop
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
