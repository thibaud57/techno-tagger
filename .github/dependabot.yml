version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    # Majeures bloquées (VERSIONS.md § Montées Bloquées)
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: "uv"
    directory: "/sidecar"
    target-branch: develop
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    target-branch: develop
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: "github-actions"
    # "/" ne couvre que .github/workflows : les actions composites locales
    # epinglent aussi des actions tierces, a suivre par leur propre entree
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: develop
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: "docker"
    directory: "/demo"
    target-branch: develop
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
