[package]
name = "techno-tagger"
version = "0.5.0"
description = "Coquille Tauri de techno-tagger : plugins, packaging et updater"
authors = ["thibaud57"]
license = "MIT"
repository = "https://github.com/thibaud57/techno-tagger"
edition = "2024"
# MSRV des crates Tauri 2.12, pas de notre code
rust-version = "1.90"

[lib]
name = "techno_tagger_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# protocol-asset : exige des que app.security.assetProtocol est actif
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-shell = "2.4.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-updater = "2.13.1"
tauri-plugin-prevent-default = "5.0.2"

# Profil recommande par Tauri pour la taille du bundle. Ne pese que sur le build
# de release en CI, `tauri dev` reste en profil dev.
[profile.release]
codegen-units = 1
lto = true
strip = true
