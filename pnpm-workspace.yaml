# Requis meme sans monorepo : pnpm 11 n'accepte plus ces reglages dans .npmrc
packages: []

# Un paquet non approuve ne casse pas l'install, son binaire manque a l'execution.
# Tous resolvent un binaire prebuilt : les quatre derniers sont des transitives
# d'@angular/build, sentry-cli est une devDependency directe.
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  "@parcel/watcher": true

# En minutes : pnpm refuse un paquet publie il y a moins d'un jour. Dependabot regenere le
# lockfile par la CLI pnpm, qui applique ce delai elle-meme : rien a aligner ailleurs.
minimumReleaseAge: 1440

# pnpm lance les scripts via cmd sous Windows, ou $VAR ne s expande pas.
scriptShell: bash

# @angular/build epingle vite 8.3.0 en exact, touche par six advisories corriges en 8.3.3
# (dont launch-editor, embarque, severite high). A retirer quand @angular/build releve son epingle.
overrides:
  vite: 8.3.5
