[project]
name = "tagger"
version = "0.1.0"
description = "Sidecar metier de techno-tagger : protocole NDJSON, tags, matching et plan de run"
authors = [
    { name = "thibaud57", email = "thibaud57@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx2>=2.12.0,<3",
    "keyring>=25.7.0,<26",
    "mutagen>=1.48.1,<2",
    "pydantic>=2.13.5,<3",
    "rapidfuzz>=3.14.5,<4",
    "sentry-sdk>=2.68.1,<3",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
# Ruff 0.16 formate les blocs Python des .md. Les exemples des rules et des knowledges
# sont ecrits a la main, commentaires alignes : le formateur les detache du code annote.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Liste figee plutot que le defaut de Ruff, qui est passe de 59 a 413 regles en 0.16
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "ASYNC",
    "S",
    "PTH",
    "PT",
    "LOG",
    "G",
    "TRY",
    "PL",
    "PERF",
    "DTZ",
    "TC",
    "TID",
    "T20",
    # `# noqa` et `# type: ignore` nus interdits : le code d'erreur est obligatoire
    "PGH",
]
# Liste officielle des regles que Ruff documente comme incompatibles avec son
# propre formateur : les laisser actives ferait se contredire `check` et `format`.
# La plupart visent des familles absentes de `select`, elles sont donc
# preventives : elles mordent le jour ou COM, ISC, Q ou D y entrent.
ignore = [
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "E111",
    "E114",
    "E117",
    "W191",
    "D203",
    "D206",
    "D300",
    # Un message court dans un validator pydantic ou sur un invariant est l'usage :
    # une classe d'exception par message serait du bruit, et EM n'est pas selectionne
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# S105/S106 : les fixtures posent une fausse cle API en dur, c'est leur role
# PLR0913/PLR0917 : les fixtures injectees sont des parametres, pas une signature a reduire
"tests/**" = ["S101", "S105", "S106", "S107", "PLR2004", "PLR0913", "PLR0917"]
"__init__.py" = ["F401"]
# Script de build lance a la main : ses messages vont sur stderr, pas au protocole
"build.py" = ["T201"]

[tool.ruff.lint.pylint]
# 5 par defaut : une fonction interne kw-only a souvent 6 ou 7 options legitimes,
# le seuil garde les vraies signatures monstres sans noqa sur chaque fonction
max-args = 8
max-positional-args = 8

[tool.ruff.lint.flake8-type-checking]
# Pydantic resout les annotations a l'execution : un --fix de TC001-TC003 qui
# deplacerait un import de modele sous TYPE_CHECKING casserait la validation
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.get_event_loop".msg = "Leve RuntimeError hors event loop en 3.14. Utiliser asyncio.run()."
"sqlite3.version".msg = "Supprime en 3.14. Utiliser sqlite3.sqlite_version pour la version du moteur."

[tool.mypy]
strict = true
warn_unreachable = true  # non couvert par strict
python_version = "3.14"
plugins = ["pydantic.mypy"]

# Genere par build.py au packaging, donc absent d'un arbre propre. Cible plutot
# que global : la disparition des types d'une vraie dependance reste une erreur.
[[tool.mypy.overrides]]
module = "tagger._build_info"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/helpers"]  # importable sans en faire un package
asyncio_mode = "strict"
# Une deprecation d'une dependance se voit au premier run, pas au jour ou elle casse
filterwarnings = ["error"]
# Un xfail qui passe est une correction non consignee : il doit echouer
xfail_strict = true
# Le seuil de couverture est bloquant dans `just test` et non ici : sur un run
# cible, la couverture globale est basse et l'habitude deviendrait de passer --no-cov
addopts = [
    "--cov=tagger",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",  # pas de bricolage sys.path, le packaging uv suffit
]

[tool.coverage.run]
# Une branche non prise compte comme couverte en mode ligne, pas ici.
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# `exclude_also` complete la liste par defaut, `exclude_lines` l'ecraserait.
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.2",
    # Porte le hook sentry-sdk, qui charge ses integrations par importlib :
    # en transitif il arrive quand meme, mais rien ne garantit qu'il y reste.
    "pyinstaller-hooks-contrib>=2026.1",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
