@if (blocked(); as reason) {
  <!-- Ecran bloquant, pas une modale : les onglets ne sont meme pas rendus. Carte sur
       surface neutre plutot qu'un pave d'alerte : le rouge signale, il ne baigne pas
       la phrase qu'il faut lire pour s'en sortir. -->
  <div class="flex flex-1 items-center justify-center p-8">
    <p-card class="max-w-lg border border-surface" [animate.enter]="fadeIn">
      <div class="flex flex-col items-center gap-6 text-center">
        <div class="flex flex-col gap-2">
          <p class="text-lg font-semibold">{{ "app.blocked." + reason + ".title" | translate }}</p>
          <p class="text-sm text-muted-color">
            {{ "app.blocked." + reason + ".text" | translate: blockedParams() }}
          </p>
        </div>
        @if (reason === "missing") {
          <button pButton type="button" [outlined]="true" severity="secondary" (click)="retry()">
            {{ "app.blocked.retry" | translate }}
          </button>
        }
      </div>
    </p-card>
  </div>
} @else {
  <p-tabs [value]="activeTab()" (valueChange)="navigate($event)">
    <p-tablist>
      @for (tab of tabs; track tab) {
        <p-tab [value]="tab">{{ "nav." + tab | translate }}</p-tab>
      }
      @if (arbitrationCount() > 0) {
        <button
          type="button"
          class="ml-auto cursor-pointer self-center px-4"
          data-arbitration-badge
          [attr.aria-label]="'arbitration.reopen' | translate"
          (click)="reopenArbitration()"
        >
          <p-tag severity="info">
            <app-icon name="info-circle" [size]="16" />
            {{ "arbitration.badge" | translate: { count: arbitrationCount() } }}
          </p-tag>
        </button>
      }
    </p-tablist>
  </p-tabs>

  <!-- Le layout est ici, une fois pour les trois onglets : une page ne pose que son contenu. -->
  <main class="flex min-h-0 flex-1 flex-col px-16 py-8">
    <router-outlet />
  </main>

  <!-- Hors du router-outlet : la modale suit l'utilisateur sur tous les onglets. -->
  <app-arbitration-dialog [visible]="arbitrationVisible()" (dismissed)="dismissArbitration()" />
}

<!-- Hors des deux branches : l'ecran bloquant peut coexister avec une demande de sortie. -->
<app-close-confirmation />

<p-toast position="bottom-right" />
